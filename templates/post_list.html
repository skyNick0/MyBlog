
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список постів</title>
</head>
<body>
    <h1>Список постів</h1>

    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <p>Дата публікації: {{ post.published_date }}</p>
        </article>
    {% empty %}
        <p>Постів поки немає.</p>
    {% endfor %}
</body>
</html>
